<div class="public-home-container">
  <!-- Header -->
  <header class="header">
    <div class="logo">
      <i class="pi pi-ticket"></i>
      <span>Ticketify</span>
    </div>
    <nav class="nav-menu">
      <a href="#" class="nav-link">Accueil</a>
      <a href="#" class="nav-link">Événements</a>
      <a href="#" class="nav-link">Connexion / Inscription</a>
      <a href="#" class="cart-icon">
        <i class="pi pi-shopping-cart"></i>
      </a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero-section">
    <h1>Recherchez un concert par<br>artiste, lieu, date, genre musical</h1>
    <div class="search-container">
      <input 
        type="text" 
        [(ngModel)]="searchQuery"
        placeholder="Recherchez un concert par artiste, lieu, date, genre musical"
        class="search-input"
      >
      <button class="search-button" (click)="onSearch()">
        <i class="pi pi-search"></i>
      </button>
    </div>
  </section>

  <!-- Popular Concerts Section -->
  <section class="popular-concerts">
    <h2>Concerts populaires</h2>
    <div class="concert-grid">
      <!-- Concert Card 1 -->
      <div class="concert-card">
        <div class="concert-image weeknd-image"></div>
        <div class="concert-info">
          <h3>The Weeknd</h3>
          <p>1er juin 2024 • Paris</p>
          <p class="price">59€</p>
        </div>
      </div>

      <!-- Concert Card 2 -->
      <div class="concert-card">
        <div class="concert-image billie-image"></div>
        <div class="concert-info">
          <h3>Billie Eilish</h3>
          <p>15 juillet 2024 • Lyon</p>
          <p class="price">79€</p>
        </div>
      </div>

      <!-- Concert Card 3 -->
      <div class="concert-card">
        <div class="concert-image imagine-dragons-image"></div>
        <div class="concert-info">
          <h3>Imagine Dragons</h3>
          <p>20 aout 2024 • Marseille</p>
          <p class="price">88€</p>
        </div>
      </div>
    </div>
  </section>
</div>
